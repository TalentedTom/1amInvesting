<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1amInvesting</title>
    <meta name="description" content="Investing in the generational AI buildout">

    <!-- Favicon + home-screen icon (generated by scripts/gen_brand_assets.py) -->
    <link rel="icon" type="image/png" sizes="64x64" href="assets/favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">

    <!-- Social share cards (Open Graph + Twitter). og:image must be an
         ABSOLUTE url — link scrapers don't resolve relative paths. -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="1amInvesting">
    <meta property="og:title" content="1amInvesting — AI supply-chain portfolio, live-scored">
    <meta property="og:description" content="Investing in the generational AI buildout. Live EV-scored portfolio of AI infrastructure &amp; supply-chain stocks, with 1-year targets and deep-dive research.">
    <meta property="og:url" content="https://www.1aminvesting.com/">
    <meta property="og:image" content="https://www.1aminvesting.com/assets/og-card.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:creator" content="@TomSzczypka">
    <meta name="twitter:title" content="1amInvesting — AI supply-chain portfolio, live-scored">
    <meta name="twitter:description" content="Investing in the generational AI buildout. Live EV-scored portfolio of AI infrastructure &amp; supply-chain stocks.">
    <meta name="twitter:image" content="https://www.1aminvesting.com/assets/og-card.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <header class="glass-header">
            <div class="header-content">
                <div class="logo-area">
                    <div class="logo-text">
                        <h1 data-i18n="title_html">1am<span>Investing</span></h1>
                        <p class="subtitle" data-i18n="subtitle">Investing in the generational AI buildout</p>
                        <!-- Kept OUTSIDE the [data-i18n] subtitle: applyTranslations
                             assigns innerHTML wholesale, which would delete this span
                             on every language switch. -->
                        <span class="mult-banner" id="mult-banner"></span>
                        <!-- Live-status pill: green dot + "Live · Xs ago" — updates
                             on every successful poll AND every 5 s via heartbeat,
                             so the visible counter ticks. If the counter stops
                             moving the polling is wedged. -->
                        <div class="live-status-wrap">
                            <span class="live-dot" aria-hidden="true"></span>
                            <span class="live-label" data-i18n="live_label">Live</span>
                            <span id="live-status" class="live-status">· —</span>
                        </div>
                    </div>
                </div>
                <div class="controls-area">
                    <div class="lang-selector">
                        <button class="lang-btn flag-btn active" data-lang="en" aria-label="English" title="English">
                            <svg class="flag-icon" viewBox="0 0 22 14" width="22" height="14" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                <rect width="22" height="14" fill="#b22234"/>
                                <g fill="#fff">
                                    <rect y="2" width="22" height="1"/>
                                    <rect y="4" width="22" height="1"/>
                                    <rect y="6" width="22" height="1"/>
                                    <rect y="8" width="22" height="1"/>
                                    <rect y="10" width="22" height="1"/>
                                    <rect y="12" width="22" height="1"/>
                                </g>
                                <rect width="9" height="7" fill="#3c3b6e"/>
                                <g fill="#fff">
                                    <circle cx="2" cy="1.5" r="0.4"/><circle cx="4" cy="1.5" r="0.4"/><circle cx="6" cy="1.5" r="0.4"/><circle cx="8" cy="1.5" r="0.4"/>
                                    <circle cx="3" cy="3" r="0.4"/><circle cx="5" cy="3" r="0.4"/><circle cx="7" cy="3" r="0.4"/>
                                    <circle cx="2" cy="4.5" r="0.4"/><circle cx="4" cy="4.5" r="0.4"/><circle cx="6" cy="4.5" r="0.4"/><circle cx="8" cy="4.5" r="0.4"/>
                                    <circle cx="3" cy="6" r="0.4"/><circle cx="5" cy="6" r="0.4"/><circle cx="7" cy="6" r="0.4"/>
                                </g>
                            </svg>
                        </button>
                        <button class="lang-btn flag-btn" data-lang="zh-CN" aria-label="中文" title="中文">
                            <svg class="flag-icon" viewBox="0 0 30 20" width="22" height="14" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                <rect width="30" height="20" fill="#de2910"/>
                                <g fill="#ffde00">
                                    <circle cx="6" cy="6" r="3"/>
                                    <circle cx="12" cy="3" r="1"/>
                                    <circle cx="14" cy="5.5" r="1"/>
                                    <circle cx="14" cy="8.5" r="1"/>
                                    <circle cx="12" cy="11" r="1"/>
                                </g>
                            </svg>
                        </button>
                    </div>
                    <div class="lang-selector theme-selector">
                        <button class="lang-btn theme-btn active" data-theme="dark" aria-label="Dark mode" title="Dark mode">
                            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                            </svg>
                        </button>
                        <button class="lang-btn theme-btn" data-theme="light" aria-label="Light mode" title="Light mode">
                            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <circle cx="12" cy="12" r="5"/>
                                <line x1="12" y1="1" x2="12" y2="3"/>
                                <line x1="12" y1="21" x2="12" y2="23"/>
                                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                                <line x1="1" y1="12" x2="3" y2="12"/>
                                <line x1="21" y1="12" x2="23" y2="12"/>
                                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                            </svg>
                        </button>
                    </div>
                    <div class="dropdown-container">
                        <button id="columns-btn" class="lang-btn dropdown-btn" data-i18n="columns_btn">Columns ▼</button>
                        <div id="columns-dropdown" class="dropdown-content hidden">
                            <!-- Populated by JS -->
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <section class="position-filter-bar">
            <div class="position-toggle" id="position-toggle" role="group" aria-label="Position type filter">
                <button class="position-btn active" data-position="all" data-i18n="pos_all">All</button>
                <button class="position-btn" data-position="chokepoint" data-i18n="pos_chokepoint">Chokepoint</button>
                <button class="position-btn" data-position="bottleneck" data-i18n="pos_bottleneck">Bottleneck</button>
                <span class="position-toggle-thumb" aria-hidden="true"></span>
            </div>
            <div class="position-explainer">
                <span data-i18n="explainer_chokepoint"><strong>Chokepoint</strong> — long-term holding, always buy dips.</span>
                <span data-i18n="explainer_bottleneck"><strong>Bottleneck</strong> — middle-duration trade, double-check why there's a dip.</span>
            </div>
        </section>

        <!-- Filter bar + deep-dive search.
             3-column grid: empty spacer | centered pill group | right-aligned search.
             On phones the grid collapses to one column and the search drops
             to its own full-width row below the pills.

             Holds the valuation-multiple selector, Region filter, Watchlist
             toggle and the 2029/2030 column toggles. The filters here compose
             (AND) with the All/Chokepoint/Bottleneck slider above; the
             multiple is not a filter at all — it re-prices rows in place.

             Search input matches against ticker symbol AND company name
             (case-insensitive substring), but only over tickers that have
             a deep-dive on file — selecting a result opens its deep-dive
             modal directly. -->
        <section class="filter-bar" id="filter-bar">
            <div class="sc-spacer" aria-hidden="true"></div>
            <div class="sc-controls">
                <!-- Each filter is wrapped in its own .filter-group so the two
                     can sit side-by-side (SuperCycle | Region) on mobile rather
                     than stacking. On desktop they flow inline as one row. -->
                <!-- Valuation multiple. NOT a filter — it re-prices every row
                     rather than hiding any. data.js targets are modelled at
                     20x, so 25x scales them x1.25 and 30x x1.5, with Upside
                     and EV Upside re-derived to match. Default 20x is the
                     unscaled baseline; JS reads the active choice from
                     localStorage, so this initial class is only the pre-JS
                     paint state. -->
                <div class="filter-group">
                    <span class="filter-label" data-i18n="mult_label">Multiple</span>
                    <button class="sc-pill mult-pill active" data-mult="20">20x</button>
                    <button class="sc-pill mult-pill" data-mult="25">25x</button>
                    <button class="sc-pill mult-pill" data-mult="30">30x</button>
                </div>
                <span class="sc-divider" aria-hidden="true"></span>
                <!-- Region filter (single-select): All / China / Ex-China.
                     "China" = Hong Kong (.HK), Shanghai (.SS/.SSE/.SH) and
                     Shenzhen (.SZ/.SZSE) listings only — Taiwan/Korea/Japan
                     are NOT counted as China. Composes (AND) with the
                     position-type and SuperCycle filters. -->
                <div class="filter-group">
                    <span class="filter-label" data-i18n="region_label">Region</span>
                    <button class="region-pill active" data-region="all" data-i18n="region_all">All</button>
                    <button class="region-pill" data-region="china" data-i18n="region_china">🇨🇳 China</button>
                    <button class="region-pill" data-region="exchina" data-i18n="region_exchina">Ex-China</button>
                </div>
                <span class="sc-divider" aria-hidden="true"></span>
                <!-- Watchlist: shows only tickers the visitor has starred.
                     Selection lives in localStorage (per-browser, no account),
                     so it survives reloads but doesn't sync across devices.
                     The count badge is populated by JS. -->
                <div class="filter-group">
                    <button class="sc-pill watchlist-btn" id="watchlist-btn" type="button" aria-pressed="false">
                        <span class="watchlist-star" aria-hidden="true">★</span><span data-i18n="watchlist_btn">Starred</span><span class="watchlist-count"></span>
                    </button>
                </div>
                <span class="sc-divider" aria-hidden="true"></span>
                <div class="filter-group">
                    <button class="sc-pill q-toggle-btn" id="show-2029-btn">2029</button>
                    <button class="sc-pill q-toggle-btn" id="show-2030-btn">2030</button>
                </div>
            </div>
            <div class="sc-search" id="sc-search">
                <span class="sc-search-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="7"/>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                    </svg>
                </span>
                <input type="search" id="sc-search-input"
                       class="sc-search-input"
                       autocomplete="off" spellcheck="false"
                       data-i18n-attr="placeholder:search_placeholder"
                       placeholder="Search deep-dives…">
                <div id="sc-search-results" class="sc-search-results hidden" role="listbox"></div>
            </div>
        </section>

        <!-- First-visit discovery hint for the deep-dive feature. Auto-hides
             after the user opens any deep-dive, or via the dismiss button.
             Persists dismissal in localStorage so it never reappears. -->
        <div class="hint-banner" id="deep-dive-hint" role="status">
            <span class="hint-icon" aria-hidden="true">💡</span>
            <span class="hint-text" data-i18n="hint_text">Click any stock symbol <span class="hint-arrow">↗</span> to see its deep-dive analysis</span>
            <button class="hint-dismiss" data-i18n-attr="aria-label:hint_dismiss_label" aria-label="Dismiss tip">×</button>
        </div>

        <main class="table-container">
            <div class="table-wrapper">
                <table id="portfolio-table">
                    <thead>
                        <tr id="table-head-row">
                            <!-- Populated by JS -->
                        </tr>
                    </thead>
                    <tbody id="table-body">
                        <!-- Populated by JS -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Deep-Dive modal. Hidden by default. Sticky header with close button
         stays visible as the body scrolls. ESC and backdrop click also close. -->
    <div id="deep-dive-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="deep-dive-title">
        <div class="modal-backdrop" data-modal-close="1"></div>
        <div class="modal-panel">
            <header class="modal-header">
                <h2 id="deep-dive-title">Deep Dive</h2>
                <!-- Prev/next: flips through deep-dives in the table's
                     current sort/filter order. Visible only in dive mode
                     (.modal.dive-mode) — hidden for TradingView charts. -->
                <div class="modal-nav" role="group" aria-label="Deep-dive navigation">
                    <button class="modal-nav-btn" id="dive-prev" type="button" data-i18n-attr="aria-label:dive_prev" aria-label="Previous deep dive">‹</button>
                    <button class="modal-nav-btn" id="dive-next" type="button" data-i18n-attr="aria-label:dive_next" aria-label="Next deep dive">›</button>
                </div>
                <button class="modal-close" data-modal-close="1" data-i18n-attr="aria-label:modal_close_label" aria-label="Close deep dive">×</button>
            </header>
            <div class="modal-content" id="deep-dive-content">
                <p class="modal-loading">Loading…</p>
            </div>
        </div>
    </div>

    <!-- Markdown renderer (small, single file, pinned). Used by the deep-dive
         modal to render the .md files served from /deep-dives/. -->
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
