<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1amInvesting</title>
    <meta name="description" content="Finding Asymmetrical Bets">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <header class="glass-header">
            <div class="header-content">
                <div class="logo-area">
                    <h1>1am<span>Investing</span></h1>
                    <p class="subtitle">Finding Asymmetrical Bets</p>
                </div>
                <div class="controls-area">
                    <div class="lang-selector">
                        <button class="lang-btn flag-btn active" data-lang="en" aria-label="English" title="English">
                            <svg class="flag-icon" viewBox="0 0 22 14" width="22" height="14" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                <rect width="22" height="14" fill="#b22234"/>
                                <g fill="#fff">
                                    <rect y="2" width="22" height="1"/>
                                    <rect y="4" width="22" height="1"/>
                                    <rect y="6" width="22" height="1"/>
                                    <rect y="8" width="22" height="1"/>
                                    <rect y="10" width="22" height="1"/>
                                    <rect y="12" width="22" height="1"/>
                                </g>
                                <rect width="9" height="7" fill="#3c3b6e"/>
                                <g fill="#fff">
                                    <circle cx="2" cy="1.5" r="0.4"/><circle cx="4" cy="1.5" r="0.4"/><circle cx="6" cy="1.5" r="0.4"/><circle cx="8" cy="1.5" r="0.4"/>
                                    <circle cx="3" cy="3" r="0.4"/><circle cx="5" cy="3" r="0.4"/><circle cx="7" cy="3" r="0.4"/>
                                    <circle cx="2" cy="4.5" r="0.4"/><circle cx="4" cy="4.5" r="0.4"/><circle cx="6" cy="4.5" r="0.4"/><circle cx="8" cy="4.5" r="0.4"/>
                                    <circle cx="3" cy="6" r="0.4"/><circle cx="5" cy="6" r="0.4"/><circle cx="7" cy="6" r="0.4"/>
                                </g>
                            </svg>
                        </button>
                        <button class="lang-btn flag-btn" data-lang="zh-CN" aria-label="中文" title="中文">
                            <svg class="flag-icon" viewBox="0 0 30 20" width="22" height="14" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                <rect width="30" height="20" fill="#de2910"/>
                                <g fill="#ffde00">
                                    <circle cx="6" cy="6" r="3"/>
                                    <circle cx="12" cy="3" r="1"/>
                                    <circle cx="14" cy="5.5" r="1"/>
                                    <circle cx="14" cy="8.5" r="1"/>
                                    <circle cx="12" cy="11" r="1"/>
                                </g>
                            </svg>
                        </button>
                    </div>
                    <div class="lang-selector theme-selector">
                        <button class="lang-btn theme-btn active" data-theme="dark" aria-label="Dark mode" title="Dark mode">
                            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                            </svg>
                        </button>
                        <button class="lang-btn theme-btn" data-theme="light" aria-label="Light mode" title="Light mode">
                            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <circle cx="12" cy="12" r="5"/>
                                <line x1="12" y1="1" x2="12" y2="3"/>
                                <line x1="12" y1="21" x2="12" y2="23"/>
                                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                                <line x1="1" y1="12" x2="3" y2="12"/>
                                <line x1="21" y1="12" x2="23" y2="12"/>
                                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                            </svg>
                        </button>
                    </div>
                    <div class="dropdown-container">
                        <button id="columns-btn" class="lang-btn dropdown-btn">Columns ▼</button>
                        <div id="columns-dropdown" class="dropdown-content hidden">
                            <!-- Populated by JS -->
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <section class="position-filter-bar">
            <div class="position-toggle" id="position-toggle" role="group" aria-label="Position type filter">
                <button class="position-btn active" data-position="all">All</button>
                <button class="position-btn" data-position="chokepoint">Chokepoint</button>
                <button class="position-btn" data-position="bottleneck">Bottleneck</button>
                <span class="position-toggle-thumb" aria-hidden="true"></span>
            </div>
            <div class="position-explainer">
                <span><strong>Chokepoint</strong> — long-term holding, always buy dips.</span>
                <span><strong>Bottleneck</strong> — middle-duration trade, double-check why there's a dip.</span>
            </div>
        </section>

        <!-- First-visit discovery hint for the deep-dive feature. Auto-hides
             after the user opens any deep-dive, or via the dismiss button.
             Persists dismissal in localStorage so it never reappears. -->
        <div class="hint-banner" id="deep-dive-hint" role="status">
            <span class="hint-icon" aria-hidden="true">💡</span>
            <span class="hint-text">Click any stock symbol <span class="hint-arrow">↗</span> to see its deep-dive analysis</span>
            <button class="hint-dismiss" aria-label="Dismiss tip">×</button>
        </div>

        <main class="table-container">
            <div class="table-wrapper">
                <table id="portfolio-table">
                    <thead>
                        <tr id="table-head-row">
                            <!-- Populated by JS -->
                        </tr>
                    </thead>
                    <tbody id="table-body">
                        <!-- Populated by JS -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Deep-Dive modal. Hidden by default. Sticky header with close button
         stays visible as the body scrolls. ESC and backdrop click also close. -->
    <div id="deep-dive-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="deep-dive-title">
        <div class="modal-backdrop" data-modal-close="1"></div>
        <div class="modal-panel">
            <header class="modal-header">
                <h2 id="deep-dive-title">Deep Dive</h2>
                <button class="modal-close" data-modal-close="1" aria-label="Close deep dive">×</button>
            </header>
            <div class="modal-content" id="deep-dive-content">
                <p class="modal-loading">Loading…</p>
            </div>
        </div>
    </div>

    <!-- Markdown renderer (small, single file, pinned). Used by the deep-dive
         modal to render the .md files served from /deep-dives/. -->
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
