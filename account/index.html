<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer"><meta name="robots" content="noindex">
<title>Account · 1amInvesting</title><link rel="stylesheet" href="/account/account.css">
<script defer src="/account-config.js"></script><script defer src="/accounts-client.js"></script><script defer src="/account/account.js"></script></head>
<body><main><nav><a href="/" id="back">← 1amInvesting</a><button id="language" type="button">简体中文</button></nav>
<h1 id="title">Account</h1><p id="status" role="status" aria-live="polite"></p>
<section id="login" hidden><p data-copy="intro"></p><div id="providers"></div></section>
<section id="member" hidden><p id="address"></p><h2 data-copy="stars"></h2><p id="symbols"></p>
<button id="import" hidden></button><form id="settings" hidden><h2 data-copy="updates"></h2>
<label class="check"><input type="checkbox" id="enabled"><span data-copy="subscribe"></span></label><label class="field"><span data-copy="mailLanguage"></span>
<select id="mail-language"><option value="en">English</option><option value="zh-CN">简体中文</option></select></label>
<button class="primary" id="save" data-copy="save"></button></form>
<div class="session"><button id="logout" data-copy="logout"></button><button id="delete" data-copy="delete"></button></div></section>
<section id="stop" hidden><p data-copy="stopIntro"></p><button id="stop-confirm" data-copy="stop"></button></section>
<details id="privacy"><summary data-copy="privacy"></summary><p data-copy="privacyBody"></p></details></main></body></html>
