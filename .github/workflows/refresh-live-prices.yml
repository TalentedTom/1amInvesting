name: Refresh live prices (no-Netlify)

# Triggers:
#   1. workflow_dispatch — fired by cron-job.org every 2-3 minutes during
#      US market hours, Mon-Fri. Primary heartbeat for live prices.
#   2. push to main, narrowed to files that affect live.json content.
#      Closes the gap between an xlsx regen committing structural changes
#      and the next cron tick picking them up. Without this trigger, any
#      change made outside market hours (e.g. weekend xlsx edits) would
#      sit stale in live.json until Monday's first cron fire — the
#      frontend would overwrite the freshly-regenerated data.js values
#      with stale live.json values for hours.
#
#      Files listed under `paths:` cover everything fetch_live.py reads
#      from or runs through:
#        data.js                — source of truth for tickers + ceilings
#        scripts/fetch_live.py  — the live-json generator itself
#        scripts/fetch_yahoo.py — fetch helper imported by fetch_live.py
#        scripts/score.py       — scoring formula (parse_range, etc.)
#        scripts/requirements.txt — dep pin changes
#   3. schedule — hourly GitHub-side BACKUP heartbeat, Mon-Fri. Insurance
#      against cron-job.org going down or auto-disabling itself (it
#      already did once, after a GitHub Actions outage fed it 26
#      consecutive 500s). Worst-case staleness with the backup alone is
#      ~1 h instead of indefinite. Zero Netlify cost (live-prices branch
#      only). Minute 17 dodges GitHub's congested top-of-hour scheduler
#      slot, which can delay :00 crons by 15+ minutes.
#
# Critical property: this workflow ONLY pushes to the `live-prices`
# branch, which Netlify is NOT configured to build. That makes price
# refreshes free of Netlify credit cost. The frontend polls
# `live.json` directly from raw.githubusercontent.com:
#   https://raw.githubusercontent.com/TalentedTom/1amInvesting/live-prices/live.json
# and patches Price / Change % / Entry / Total / Upside cells in place
# every 30 seconds.
#
# Structural changes (new tickers, deep-dives, scoring formula) still
# go through `main` -> Netlify -> rebuild flow, exactly as before.

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * 1-5'   # hourly backup heartbeat, Mon-Fri (see #3 above)
  push:
    branches: [main]
    paths:
      - 'data.js'
      - 'scripts/fetch_live.py'
      - 'scripts/fetch_yahoo.py'
      - 'scripts/score.py'
      - 'scripts/requirements.txt'

permissions:
  contents: write       # we push live.json to the live-prices branch

# Concurrency: let slow runs FINISH instead of cancelling them.
#   `cancel-in-progress: false` means: when a new cron tick fires while
#   a previous run is still going, the new fire waits in the pending
#   queue rather than killing the running one. GitHub keeps at most
#   1 running + 1 pending per concurrency group; additional pending
#   fires replace each other (so the queue never grows unbounded).
#
# Why this change (from earlier `cancel-in-progress: true`):
#   yfinance is occasionally slow — runs that would normally take 60s
#   sometimes balloon to 3-5 minutes during peak market hours. Under
#   the old cancel-aggressive setting, those slow runs would get
#   killed by the next 2-min cron tick before they could push, AND
#   the next run after that, and the next — chaining cancellations
#   that delayed live.json updates by 10+ minutes. Letting slow runs
#   finish makes the system self-healing: the SLOW run completes
#   eventually, the queued fresh fire then runs against fresh state.
concurrency:
  group: refresh-live-prices
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Bumped from 5 to 10 min to give slow yfinance fetches room to
    # complete rather than hard-failing at the timeout. Normal runs
    # still finish in <90 s; this is purely a safety margin for the
    # bad days.
    timeout-minutes: 10
    steps:
      - name: Check out main (for data.js + scripts)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'scripts/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Fetch live prices and compute scores
        # Writes to /tmp so the main worktree stays clean — we'll commit
        # the file onto the orphan branch below without ever touching
        # main's tree.
        run: |
          mkdir -p /tmp/live-out
          python scripts/fetch_live.py --output /tmp/live-out/live.json
          ls -l /tmp/live-out/live.json

      - name: Push live.json to live-prices branch (single-commit, force-pushed)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Build the live-prices branch in a fresh tempdir, completely
          # isolated from main's worktree. The branch always has exactly
          # one commit (force-pushed each run) — history would be
          # meaningless for a 2-minute price tick anyway.
          set -e
          LIVE_DIR=$(mktemp -d)
          cd "$LIVE_DIR"

          git init --quiet --initial-branch=live-prices
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          cp /tmp/live-out/live.json live.json
          git add live.json
          git commit -m "live prices $(date -u +'%Y-%m-%d %H:%M:%S') UTC" --quiet

          # Push using x-access-token auth — the workflow's GITHUB_TOKEN
          # has 'contents: write' permission (set on this workflow above).
          # Force-push because we replace the entire branch every run.
          REMOTE_URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push "$REMOTE_URL" HEAD:refs/heads/live-prices --force --quiet

          echo "Pushed to live-prices. CDN URL (statically.io):"
          echo "  https://cdn.statically.io/gh/${GITHUB_REPOSITORY}@live-prices/live.json"
