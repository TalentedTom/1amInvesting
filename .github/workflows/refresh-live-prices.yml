name: Refresh live prices (no-Netlify)

# Trigger: manual (workflow_dispatch) only. Designed to be fired by
# cron-job.org every 2-3 minutes during market hours.
#
# Critical property: this workflow ONLY pushes to the `live-prices`
# branch, which Netlify is NOT configured to build. That makes price
# refreshes free of Netlify credit cost. The frontend polls
# `live.json` directly from jsdelivr's CDN:
#   https://cdn.jsdelivr.net/gh/TalentedTom/1amInvesting@live-prices/live.json
# and patches Price / Change % / Entry / Total / Upside cells in place
# every 60 seconds.
#
# Structural changes (new tickers, deep-dives, scoring formula) still
# go through `main` -> Netlify -> rebuild flow, exactly as before.

on:
  workflow_dispatch:

permissions:
  contents: write       # we push live.json to the live-prices branch

# Kill any in-flight run if a new cron tick fires before the previous
# one finishes. Yfinance is occasionally slow; we'd rather skip a fire
# than queue an overlapping commit.
concurrency:
  group: refresh-live-prices
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out main (for data.js + scripts)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'scripts/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Fetch live prices and compute scores
        # Writes to /tmp so the main worktree stays clean — we'll commit
        # the file onto the orphan branch below without ever touching
        # main's tree.
        run: |
          mkdir -p /tmp/live-out
          python scripts/fetch_live.py --output /tmp/live-out/live.json
          ls -l /tmp/live-out/live.json

      - name: Push live.json to live-prices branch (orphan, force-pushed)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Build a fresh orphan commit containing nothing but live.json.
          # Force-push to live-prices so the branch always has exactly
          # one commit — no history bloat from 2-minute price ticks.
          #
          # We use a tempdir + low-level plumbing rather than checking
          # out live-prices, to avoid the cost of touching the
          # filesystem with thousands of unrelated files.
          tmp_index=$(mktemp)
          export GIT_INDEX_FILE="$tmp_index"

          # Copy live.json into the worktree just long enough to hash it.
          cp /tmp/live-out/live.json live.json
          git add -- live.json
          tree_sha=$(git write-tree)
          # Restore the worktree so subsequent steps see a clean main.
          rm -f live.json

          commit_msg="live prices $(date -u +'%Y-%m-%d %H:%M:%S') UTC"
          commit_sha=$(echo "$commit_msg" | git commit-tree "$tree_sha")
          echo "Built orphan commit $commit_sha for tree $tree_sha"

          # Force-push the new commit as the entire history of
          # live-prices. Safe because this branch is single-purpose;
          # no human or other workflow ever pushes to it.
          git push origin "$commit_sha":refs/heads/live-prices --force

          echo "Pushed to live-prices. CDN URL:"
          echo "  https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@live-prices/live.json"
